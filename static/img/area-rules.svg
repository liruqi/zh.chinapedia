ont-size="12.0" fill="#dc2626" text-anchor="start" font-weight="normal">两者在 x = 0 处拉开差距 →</text><text x="70" y="336" font-size="12" fill="#6b7280">蓝点 = 台阶角点；Faulhaber 曲线全部经过，面积平衡曲线全部错过</text><line x1="556.55" y1="238.33" x2="907.17" y2="238.33" stroke="#9ca3af" stroke-width="1.30"/><line x1="633.52" y1="299.80" x2="633.52" y2="66.20" stroke="#1f2328" stroke-width="1.70"/><text x="556.55" y="317.80" font-size="12.0" fill="#6b7280" text-anchor="middle" font-weight="normal">y</text><line x1="592.90" y1="238.33" x2="592.90" y2="272.48" stroke="#dc2626" stroke-width="1.50" stroke-dasharray="3,2"/><path d="M 599.29,235.47 L 592.90,238.33" stroke="#dc2626" stroke-width="1.50" fill="none" stroke-linecap="round"/><path d="M 599.29,241.18 L 592.90,238.33" stroke="#dc2626" stroke-width="1.50" fill="none" stroke-linecap="round"/><path d="M 586.50,275.34 L 592.90,272.48" stroke="#dc2626" stroke-width="1.50" fill="none" stroke-linecap="round"/><path d="M 586.50,269.63 L 592.90,272.48" stroke="#dc2626" stroke-width="1.50" fill="none" stroke-linecap="round"/><text x="580.07" y="259.40" font-size="12.0" fill="#dc2626" text-anchor="end" font-weight="bold">÷2</text><line x1="633.52" y1="238.33" x2="652.76" y2="238.33" stroke="#2563eb" stroke-width="1.20" stroke-dasharray="2,2"/><circle cx="633.52" cy="238.33" r="5.00" fill="#2563eb"/><text x="661.31" y="242.33" font-size="13.0" fill="#2563eb" text-anchor="start" font-weight="normal">Faulhaber 常数项 = 0</text><line x1="633.52" y1="255.40" x2="652.76" y2="255.40" stroke="#dc2626" stroke-width="1.20" stroke-dasharray="2,2"/><circle cx="633.52" cy="255.40" r="5.00" fill="#dc2626"/><text x="661.31" y="259.40" font-size="13.0" fill="#dc2626" text-anchor="start" font-weight="bold">ζ(−1) = −1/12</text><line x1="633.52" y1="272.48" x2="652.76" y2="272.48" stroke="#ea580c" stroke-width="1.20" stroke-dasharray="2,2"/><circle cx="633.52" cy="272.48" r="5.00" fill="#ea580c"/><text x="661.31" y="276.48" font-size="13.0" fill="#ea580c" text-anchor="st