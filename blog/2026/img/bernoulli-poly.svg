size="13" fill="#1f2328">② B′ₘ(x) = m · Bₘ₋₁(x)</text><text x="460" y="270" font-size="13" fill="#1f2328">③ ∫₀¹ Bₘ(x) dx = 0 (m ≥ 1)</text><text x="460" y="312" font-size="12" fill="#6b7280">第③条「在 [0,1] 上均值为零」</text><text x="460" y="332" font-size="12" fill="#6b7280">把 B₂ 里的 1/6 钉死了；</text><text x="460" y="352" font-size="12" fill="#6b7280">后面所有常数都从它来。</text></svg>